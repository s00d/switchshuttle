name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    # Висящее зеркало apt иначе держит job до лимита GitHub (6 часов)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # azure.archive.ubuntu.com на раннерах периодически зависает на скачивании
      - name: Use main Ubuntu mirror
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' "$f"
          done
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null

      # Пакеты кэшируются: скачивание только при первом прогоне или смене списка/version
      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
          version: 1.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Also produces ../dist, which tauri::generate_context! needs at compile time
      - name: Build frontend (type-check + vite)
        run: pnpm build

      - name: Lint
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm lint

      - name: Frontend tests
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm vitest run

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
